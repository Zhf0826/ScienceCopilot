<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScienceCopilot AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ScienceCopilot AI</h1>
        <p>小学科学教师智能助手 · <span class="tag">LLM · Prompt · Agent · RAG</span></p>
      </div>
      <div class="topbar-right">
        <span class="status" id="engineStatus">引擎加载中…</span>
        <a class="intro-link" href="/intro.html">项目介绍 →</a>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-title">
          <span>01</span>
          <h2>探究活动生成</h2>
        </div>

        <label>
          年级
          <input id="grade" value="四年级" placeholder="例如：四年级" />
        </label>

        <label>
          主题
          <input id="topic" value="水的蒸发" placeholder="例如：水的蒸发" />
        </label>

        <label>
          教学目标
          <textarea id="goal" rows="3" placeholder="希望学生理解什么、会做什么">理解蒸发可以在常温下发生，并能设计公平比较实验。</textarea>
        </label>

        <div class="two-col">
          <label>
            课堂时间
            <input id="duration" value="40分钟" />
          </label>
          <label>
            材料限制
            <input id="materials" value="普通教室材料，避免明火" />
          </label>
        </div>

        <button id="generateBtn">生成探究方案</button>
        <div id="inquiryResult" class="result">
          <pre class="output">生成结果会显示在这里。</pre>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <span>02</span>
          <h2>科学内容审核</h2>
        </div>

        <label>
          教师文本
          <textarea id="auditText" rows="8" placeholder="粘贴一段教案、讲解词或实验说明">水只有烧开以后才会变成水蒸气，所以蒸发就是沸腾。</textarea>
        </label>

        <button id="auditBtn">审核科学内容</button>
        <div id="auditResult" class="result">
          <pre class="output">审核结果会显示在这里。</pre>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
